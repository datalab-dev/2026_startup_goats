[workspace]
authors = [
  "Camila Chicatto <cchicatto@ucdavis.edu>",
  "Hilary Choi <hfchoi@ucdavis.edu>",
  "Justin Huang <jjhhwang@ucdavis.edu>",
  "Rashmit Shrestha <rlshrestha@ucdavis.edu>",
  "Odelyn Xie <delxie@ucdavis.edu>",
  "Colton Baumler <ccbaumler@ucdavis.edu>",
  "Nick Ulle <nick.ulle@gmail.com>"
]
channels = ["conda-forge"]
name = "2026_startup_goats"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
r = ">=4.5,<4.6"

[activation.env]
# Make sure R only searches for packages within the Pixi environment.
PIXI_R_LIBS = "$CONDA_PREFIX/lib/R/library"
R_LIBS = "$PIXI_R_LIBS"
R_LIBS_USER = "$PIXI_R_LIBS"
R_LIBS_SITE = "$PIXI_R_LIBS"
QUARTO_R = "$CONDA_PREFIX/bin/R"
